name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建发行包(install.sh + 预编译 daemon)
    # 仅编译 daemon.c + zip,不依赖 hdiutil/macos-14 镜像;macos-latest 队列更宽裕
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 编译守护(universal binary,ad-hoc 签名)
        run: clang -O2 -Wall -Wextra -arch arm64 -arch x86_64 -o /tmp/daemon src/daemon.c && codesign --force -s - /tmp/daemon
      - name: 生成 pnpm-lock.yaml(预解析依赖树,用户安装跳解析省时;与 install.sh 同配置)
        run: |
          # 自动跟随上游 latest 标签(dsh 稳定版本;与 install.sh 的 DSH_VERSION 默认一致)
          DSH_VERSION="${DSH_VERSION:-latest}"
          npm i -g pnpm@10 >/dev/null 2>&1
          mkdir -p /tmp/dsh-lock
          printf '{"name":"dsh-lock","private":true,"dependencies":{"@deepseek-ai/dsh":"%s"},"pnpm":{"onlyBuiltDependencies":["node-pty","koffi","@deepseek-ai/dsh-subprocess-local"]}}\n' "$DSH_VERSION" > /tmp/dsh-lock/package.json
          cd /tmp/dsh-lock && pnpm install --lockfile-only --ignore-scripts --loglevel=error
          mkdir -p /tmp/pkg
          cp /tmp/dsh-lock/pnpm-lock.yaml /tmp/pkg/pnpm-lock.yaml
      - name: 校验生成的 pnpm-lock.yaml(依赖树可解析性门禁)
        run: |
          set -euo pipefail
          # 本仓库不追踪 pnpm-lock.yaml(发行包内的 lock 由上一步现场生成),因此不存在
          # “仓库版本 vs 生成版本”的 diff 对象——旧步骤恒走 else 打印“无变化”,属误导。
          # 改为真实可用的门禁:lock 必须生成成功且非空,否则安装端会退回现场解析(慢但可用),
          # 把它当异常暴露而非静默;并打印解析到的 dsh 版本便于审计。
          if [ ! -s /tmp/pkg/pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml 未生成或为空(lockfile-only 解析失败)"
            exit 1
          fi
          echo "✓ pnpm-lock.yaml 已生成($(wc -l < /tmp/pkg/pnpm-lock.yaml | tr -d ' ') 行)"
          echo "解析到的 dsh 版本:"
          grep -E "deepseek-ai/dsh@" /tmp/pkg/pnpm-lock.yaml | head -3 || true
          if [ -f pnpm-lock.yaml ]; then
            if diff -q pnpm-lock.yaml /tmp/pkg/pnpm-lock.yaml >/dev/null 2>&1; then
              echo "✓ 与仓库追踪版本一致"
            else
              echo "⚠️ 与仓库追踪的 pnpm-lock.yaml 存在差异(依赖树更新),摘要:"
              diff -u pnpm-lock.yaml /tmp/pkg/pnpm-lock.yaml | head -50 || true
            fi
          else
            echo "(仓库未追踪 pnpm-lock.yaml,跳过 diff;发行包内 lock 以本步骤生成结果为准)"
          fi
      - name: 冒烟测试(打包前置:install → 守护 → 唤醒 → 透传 → 空闲自停)
        # release 也可能在无 GUI 会话的 runner 上跑:smoke-test.sh 对 socket activation 段
        # 做条件跳过并显式输出 [SKIP](不静默),其余冒烟项必须真实通过
        run: bash scripts/smoke-test.sh
      - name: 打包(install.sh + daemon + daemon.c + plist + lock + cleanup + update-dsh)
        run: |
          mkdir -p /tmp/pkg/launchd /tmp/pkg/scripts
          cp /tmp/daemon /tmp/pkg/daemon
          cp scripts/install.sh /tmp/pkg/install.sh
          cp scripts/cleanup-deps.sh /tmp/pkg/scripts/cleanup-deps.sh
          cp scripts/update-dsh.sh /tmp/pkg/scripts/update-dsh.sh
          cp src/daemon.c /tmp/pkg/daemon.c
          # 一致性记录:记录预编译 daemon 对应的 daemon.c 指纹。install.sh 预编译分支会把它
          # 落到 RT_HOME/.daemon.md5,使「发行包装机 → 后续源码安装」的免编译判断保持一致
          # (源码路径兼容:包内 daemon.c 在包根,仓库内为 src/daemon.c)。
          ( cd /tmp/pkg && md5 -q daemon.c > .daemon.md5 )
          cp launchd/com.dshpwa.daemon.plist /tmp/pkg/launchd/
          cp launchd/com.dshpwa.updater.plist /tmp/pkg/launchd/
          cd /tmp/pkg && zip -qr dsh-pwa.zip .
          shasum -a 256 dsh-pwa.zip > dsh-pwa.zip.sha256
      - name: 发布到 GitHub Releases(下载链接)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" /tmp/pkg/dsh-pwa.zip /tmp/pkg/dsh-pwa.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-pwa $TAG" \
            --notes-file "$GITHUB_WORKSPACE/.github/RELEASE_NOTES.md" \
            || gh release upload "$TAG" /tmp/pkg/dsh-pwa.zip /tmp/pkg/dsh-pwa.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber