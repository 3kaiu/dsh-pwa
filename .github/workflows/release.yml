name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建发行包(install.sh + 预编译 daemon)
    # 仅编译 daemon.c + zip,不依赖 hdiutil/macos-14 镜像;macos-latest 队列更宽裕
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 编译守护(universal binary,ad-hoc 签名)
        run: clang -O2 -Wall -Wextra -arch arm64 -arch x86_64 -o /tmp/daemon src/daemon.c && codesign --force -s - /tmp/daemon
      - name: 生成 pnpm-lock.yaml(预解析依赖树,用户安装跳解析省时;与 install.sh 同配置)
        run: |
          # 自动跟随上游 latest 标签(dsh 稳定版本;与 install.sh 的 DSH_VERSION 默认一致)
          DSH_VERSION="${DSH_VERSION:-latest}"
          npm i -g pnpm@10 >/dev/null 2>&1
          mkdir -p /tmp/dsh-lock
          # 与 install.sh 写进 $APP_DIR/package.json 的内容**逐字一致**(含 name):
          # install.sh 现在会带 --frozen-lockfile 安装,任何字段漂移都会让冻结校验失败。
          printf '{"name":"dsh-runtime-app","private":true,"dependencies":{"@deepseek-ai/dsh":"%s"},"pnpm":{"onlyBuiltDependencies":["node-pty","koffi","@deepseek-ai/dsh-subprocess-local"]}}\n' "$DSH_VERSION" > /tmp/dsh-lock/package.json
          cd /tmp/dsh-lock && pnpm install --lockfile-only --ignore-scripts --loglevel=error
          mkdir -p /tmp/pkg
          cp /tmp/dsh-lock/pnpm-lock.yaml /tmp/pkg/pnpm-lock.yaml
      - name: 校验生成的 pnpm-lock.yaml(依赖树可解析性门禁)
        run: |
          set -euo pipefail
          # 本仓库不追踪 pnpm-lock.yaml(发行包内的 lock 由上一步现场生成),因此不存在
          # “仓库版本 vs 生成版本”的 diff 对象——旧步骤恒走 else 打印“无变化”,属误导。
          # 改为真实可用的门禁:lock 必须生成成功且非空,否则安装端会退回现场解析(慢但可用),
          # 把它当异常暴露而非静默;并打印解析到的 dsh 版本便于审计。
          if [ ! -s /tmp/pkg/pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml 未生成或为空(lockfile-only 解析失败)"
            exit 1
          fi
          echo "✓ pnpm-lock.yaml 已生成($(wc -l < /tmp/pkg/pnpm-lock.yaml | tr -d ' ') 行)"
          echo "解析到的 dsh 版本:"
          grep -E "deepseek-ai/dsh@" /tmp/pkg/pnpm-lock.yaml | head -3 || true
          if [ -f pnpm-lock.yaml ]; then
            if diff -q pnpm-lock.yaml /tmp/pkg/pnpm-lock.yaml >/dev/null 2>&1; then
              echo "✓ 与仓库追踪版本一致"
            else
              echo "⚠️ 与仓库追踪的 pnpm-lock.yaml 存在差异(依赖树更新),摘要:"
              diff -u pnpm-lock.yaml /tmp/pkg/pnpm-lock.yaml | head -50 || true
            fi
          else
            echo "(仓库未追踪 pnpm-lock.yaml,跳过 diff;发行包内 lock 以本步骤生成结果为准)"
          fi
      - name: 冒烟测试(打包前置:install → 守护 → 唤醒 → 透传 → 空闲自停)
        # release 也可能在无 GUI 会话的 runner 上跑:smoke-test.sh 对 socket activation 段
        # 做条件跳过并显式输出 [SKIP](不静默),其余冒烟项必须真实通过
        run: bash scripts/smoke-test.sh
      - name: 打包(install.sh + daemon + daemon.c + plist + lock + cleanup + update-dsh + dsh-probe)
        run: |
          mkdir -p /tmp/pkg/launchd /tmp/pkg/scripts
          cp /tmp/daemon /tmp/pkg/daemon
          cp scripts/install.sh /tmp/pkg/install.sh
          cp scripts/cleanup-deps.sh /tmp/pkg/scripts/cleanup-deps.sh
          cp scripts/update-dsh.sh /tmp/pkg/scripts/update-dsh.sh
          # dsh-probe.sh 是 A4「更新后真实启动探测」的执行体:update-dsh.sh 通过
          # $RT_HOME/scripts/dsh-probe.sh 调用它,install.sh 从 $ROOT/scripts/ 部署。
          # 漏打进包 ⇒ install.sh 的 [ -f ... ] 为假 ⇒ 静默不部署 ⇒ 更新器每次只打印
          # 「启动探测脚本缺失,跳过探测」⇒ A4 在实际发行里**完全失效却全绿**。
          cp scripts/dsh-probe.sh /tmp/pkg/scripts/dsh-probe.sh
          cp src/daemon.c /tmp/pkg/daemon.c
          # 包装器自身版本:install.sh 读包内 VERSION 写入 $RT_HOME/.wrapper-version,
          # 守护据此在 /health 报 wrapper_outdated。不写死常量,直接取触发本次构建的 tag。
          printf '%s\n' "${{ github.ref_name }}" > /tmp/pkg/VERSION
          # 一致性记录:记录预编译 daemon 对应的 daemon.c 指纹。install.sh 预编译分支会把它
          # 落到 RT_HOME/.daemon.md5,使「发行包装机 → 后续源码安装」的免编译判断保持一致
          # (源码路径兼容:包内 daemon.c 在包根,仓库内为 src/daemon.c)。
          ( cd /tmp/pkg && md5 -q daemon.c > .daemon.md5 )
          cp launchd/com.dshpwa.daemon.plist /tmp/pkg/launchd/
          cp launchd/com.dshpwa.updater.plist /tmp/pkg/launchd/
          cd /tmp/pkg && zip -qr dsh-pwa.zip .
          shasum -a 256 dsh-pwa.zip > dsh-pwa.zip.sha256
      - name: 发行包端到端门禁(解压真实产物 → 用包内 install.sh 跑完整冒烟)
        # 深层审计 A1:上面的冒烟只跑仓库源码树,而发行包解压后的真实布局
        # (包根 install.sh + 预编译 daemon,无 src/daemon.c)从未被安装过 —— 这正是
        # 「SHA-256 清单文件名不匹配致 curl|bash 恒失败」能长期存活的根因。
        # 本步骤验证「发出去的东西」能装能跑,失败即阻断发布。
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg-e2e /tmp/pkg-e2e-smoke
          mkdir -p /tmp/pkg-e2e
          ( cd /tmp/pkg-e2e && unzip -q /tmp/pkg/dsh-pwa.zip )
          [ -f /tmp/pkg-e2e/install.sh ] || { echo "::error::发行包内缺少 install.sh"; exit 1; }
          [ -f /tmp/pkg-e2e/daemon ] || { echo "::error::发行包内缺少预编译 daemon"; exit 1; }
          # 脚本与版本文件是「静默降级」的高危区:缺 dsh-probe.sh ⇒ 更新器的 A4 探测永远跳过;
          # 缺 VERSION ⇒ 包装器自我版本退化成 unknown、/health 的 wrapper_outdated 失去意义。
          # 两者都只在运行期打一行日志,冒烟也不会因此变红 —— 故必须在打包处硬断言。
          for f in scripts/update-dsh.sh scripts/cleanup-deps.sh scripts/dsh-probe.sh VERSION; do
            [ -f "/tmp/pkg-e2e/$f" ] || { echo "::error::发行包内缺少 $f"; exit 1; }
          done
          echo "✓ 包内容完整(install.sh / daemon / 3 个脚本 / VERSION)"
          # 用包内 install.sh(而非仓库 scripts/install.sh)跑完整冒烟:
          # install → 守护 → 唤醒 → 透传 → 空闲自停。SMOKE_ROOT/SMOKE_PORT 隔离,
          # 避免与上一步冒烟互相污染。
          SMOKE_ROOT=/tmp/pkg-e2e-smoke SMOKE_PORT=13981 \
            bash scripts/smoke-test.sh /tmp/pkg-e2e/install.sh
      - name: 发布到 GitHub Releases(下载链接)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" /tmp/pkg/dsh-pwa.zip /tmp/pkg/dsh-pwa.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-pwa $TAG" \
            --notes-file "$GITHUB_WORKSPACE/.github/RELEASE_NOTES.md" \
            || gh release upload "$TAG" /tmp/pkg/dsh-pwa.zip /tmp/pkg/dsh-pwa.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber
      - name: 校验发布资产真的可下载(install 路径的真实依赖)
        # 深层审计 S1 的教训:校验逻辑再正确,只要 release 资产取不到,`curl|bash` 就是死的。
        # 实测(2026-09-12):v0.3.1 的「发布」步骤结论是 success、日志也打印了 release URL,
        # 但事后 `gh api .../releases` 为 0、`releases/download/v0.3.1/dsh-pwa.zip` 404 ——
        # 发布成功 ≠ 资产可用,而 CI 里没有任何一步会去下载它。本步骤补上这个缺口:
        # 下载「用户实际会拿到的那份」,与本次构建产物比对哈希,不一致即让 Release 变红。
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          OK=0
          for i in 1 2 3 4 5; do
            # 资产上传后 CDN 生效有秒级延迟:重试而非直接判死(避免把传播延迟报成缺陷)
            if curl -fsSL --max-time 60 -o /tmp/dl.zip "$BASE/dsh-pwa.zip" \
               && curl -fsSL --max-time 60 -o /tmp/dl.zip.sha256 "$BASE/dsh-pwa.zip.sha256"; then
              OK=1
              break
            fi
            echo "第 ${i} 次取资产失败,5s 后重试…"
            sleep 5
          done
          if [ "$OK" != "1" ]; then
            echo "::error::发布资产不可下载:${BASE}/dsh-pwa.zip —— curl|bash 安装已失效"
            exit 1
          fi
          EXPECTED="$(awk 'NF {print $1; exit}' /tmp/dl.zip.sha256)"
          ACTUAL="$(shasum -a 256 /tmp/dl.zip | awk '{print $1}')"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::下载到的资产与清单哈希不符(期望 ${EXPECTED:-<空>},实际 ${ACTUAL})"
            exit 1
          fi
          LOCAL="$(shasum -a 256 /tmp/pkg/dsh-pwa.zip | awk '{print $1}')"
          if [ "$EXPECTED" != "$LOCAL" ]; then
            echo "::error::线上资产与本次构建产物不一致(线上 ${EXPECTED},本地 ${LOCAL})"
            exit 1
          fi
          echo "✓ 发布资产可下载且与构建产物哈希一致(${EXPECTED})"