name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译守护 + 一键安装冒烟(真实上游 node + dsh)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 守护编译检查
        run: clang -O2 -Wall -Wextra -o /tmp/daemon src/daemon.c && codesign --force -s - /tmp/daemon
      - name: 一键安装冒烟(install → 守护 → 唤醒 → 透传 → 空闲自停)
        run: bash scripts/smoke-test.sh
      - name: 安全套件(CSRF/Origin 运行时验证)
        run: bash tests/security-verification.sh