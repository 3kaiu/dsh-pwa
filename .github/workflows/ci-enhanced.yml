name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: 编译 + bats 单测 + 冒烟 + 安全套件
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 编译守护进程 (universal binary)
        run: |
          set -euo pipefail
          clang -O2 -Wall -Wextra -Werror \
            -arch arm64 -arch x86_64 \
            -o /tmp/daemon src/daemon.c

      - name: 代码签名
        run: codesign --force -s - /tmp/daemon

      - name: 验证二进制架构
        run: |
          set -euo pipefail
          file /tmp/daemon
          lipo -info /tmp/daemon
          stat -f%z /tmp/daemon

      - name: Bats 单元测试 (install 端口校验 / daemon 编译 / 脚本语法)
        run: |
          set -euo pipefail
          brew install bats-core
          # 必须经 bats 运行器执行(bats 文件是 DSL,bash file.bats 无法运行)
          bats tests/unit/*.bats
          # 反空转(TRAPS §一.16/§一.18):bats 在「一个用例都没跑」时照样 exit 0 ——
          #   @test 名含非 ASCII 会**静默执行 0 例**;`--filter` 是正则,名字里的元字符会静默不匹配。
          # 只断言「没红」等于没断言。故显式比对**执行数**:`bats -c` 只统计不执行,口径与上行一致
          #   (不用 `grep -c '@test'` —— 它会把注释里的 @test 也算上)。
          # 下界**随用例增减人工上调**;它唯一的作用是发现「静默不执行」,不追求精确。
          N="$(bats -c tests/unit/*.bats)"
          case "$N" in
            ''|*[!0-9]*) echo "bats -c 未返回数字:[$N]" >&2; exit 1 ;;
          esac
          echo "bats 用例数:$N"
          if [ "$N" -lt 96 ]; then
            echo "bats 用例数 $N 低于下界 96 —— 有用例被静默跳过(非 ASCII 名 / --filter 元字符)?" >&2
            exit 1
          fi

      - name: 一键安装冒烟测试
        run: bash scripts/smoke-test.sh

      - name: 安全验证套件
        run: bash tests/security-verification.sh

      - name: 自动更新功能验证套件
        run: bash tests/auto-update-verify.sh

  static-analysis:
    name: 静态分析
    runs-on: macos-latest
    # 与 build-and-test(30)/release(25)保持一致:不声明则回落到 GitHub 默认 360min,
    # 任何一步卡住都会白烧 6 小时 runner。本 job 实测约 17s,15min 已是两个数量级余量。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck (Bash 脚本检查,门禁)
        run: |
          set -euo pipefail
          brew install shellcheck
          # -S warning:错误/警告级为门禁;info 级风格提示不阻断(现有脚本均为有意的写法)
          shellcheck -S warning scripts/*.sh tests/*.sh tests/lib/*.sh

      - name: Clang Static Analyzer (门禁)
        run: |
          set -euo pipefail
          # 关键:clang --analyze 即使发现缺陷退出码也为 0,且管道会吞掉退出码——必须显式
          # 断言输出中不含 analyzer 诊断(否则 job 永远绿,是假门禁)。set -o pipefail 也不够。
          clang --analyze \
            -Xanalyzer -analyzer-output=text \
            -Wall -Wextra \
            src/daemon.c 2>&1 | tee static-analysis.log
          if grep -Eq 'warning:|error:' static-analysis.log; then
            echo "::error::clang 静态分析报告了缺陷(详见上方 static-analysis.log)"
            exit 1
          fi
          echo "✓ clang 静态分析零告警"

      - name: 上传分析结果
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: static-analysis
          path: static-analysis.log

  performance:
    name: 性能基准
    runs-on: macos-latest
    # 同上:本 job 含 brew install hyperfine + 基准运行,实测约 18s;20min 足够且封顶。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装依赖
        run: brew install hyperfine

      - name: 编译并安装守护进程
        run: |
          set -euo pipefail
          clang -O2 -Wall -Wextra -Werror \
            -arch arm64 -arch x86_64 \
            -o /tmp/daemon src/daemon.c
          mkdir -p ~/.local/share/dsh-runtime ~/.local/state/dsh-runtime/logs
          cp /tmp/daemon ~/.local/share/dsh-runtime/daemon
          codesign --force -s - ~/.local/share/dsh-runtime/daemon

      - name: 性能基准测试 (非门禁)
        run: |
          set -euo pipefail
          # 基准需要守护在线:smoke-test 在 build-and-test 已跑完(其守护退出即自停),
          # 这里单独拉起基准实例(缺 run.json 时守护仅应答 /health,足够基准测量)
          #
          # DSH_RT_NO_AUTO_UPDATE=1 是必需的,不只是洁癖:
          # 守护每次启动都会 fork 一个 setsid 的更新检查子进程(trigger_background_update()),它先 sleep(10)
          # 再 exec update-dsh.sh;在那 10s 里它是**同名的 daemon 进程**且自成会话 —— 下面 trap
          # 里的 kill "$BPID" 杀不到它。本步骤很短(实测约 3.5s),job 收尾时它还在睡,于是 runner
          # 稳定报 `Terminate orphan process: pid (…) (daemon)`(实测 run 34647776445 / 34651085008
          # 各 1 个)。顺带它还会在基准测量期间抢 CPU/网络,污染结果。
          # 同一约定见 tests/unit/daemon-cases.bats 的 setup(DSH_RT_NO_AUTO_UPDATE=1)
          # 与 tests/security-verification.sh。
          DSH_RT_HOME="$HOME/.local/share/dsh-runtime" \
          DSH_RT_STATE="$HOME/.local/state/dsh-runtime" \
          DSH_HOME="$HOME/.dsh" \
          DSH_RT_NO_AUTO_UPDATE=1 \
          DSH_RT_PORT=3080 "$HOME/.local/share/dsh-runtime/daemon" \
            >/tmp/bench-daemon.log 2>&1 &
          BPID=$!
          trap 'kill "$BPID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            # 带超时:守护「已 bind 未 listen」时 macOS 丢弃 SYN,无超时的 curl 会挂死整个 job
            # 绕过代理:curl 默认把 127.0.0.1 交给 http_proxy,此时「守护已死」拿到的是代理的
            # 502 而非连接拒绝(000);本处有 -f 兜底(502 会非零退出)但重试语义仍被污染
            # ——20 次探测全被代理吞掉,守护其实已就绪也会走满 10s。与 smoke-test.sh 同约定。
            curl -fsS --max-time 2 --noproxy '*' -o /dev/null "http://127.0.0.1:3080/health" 2>/dev/null && break
            sleep 0.5
          done
          if DSH_RT_PORT=3080 bash scripts/benchmark.sh; then
            echo "✓ 基准测试完成"
          else
            echo "[SKIP] 基准测试失败(守护未响应/hyperfine 不可用)——长耗时/非确定性检查,不设门禁,详见上方日志"
          fi

      - name: 上传基准结果
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance-benchmark
          path: /tmp/benchmark-*.md

  binary-analysis:
    name: 二进制分析
    runs-on: macos-latest
    # 同上:本 job 仅编译 + otool/nm 分析,实测约 10s。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 编译守护进程
        run: |
          set -euo pipefail
          clang -O2 -Wall -Wextra -Werror \
            -arch arm64 -arch x86_64 \
            -o /tmp/daemon src/daemon.c

      - name: 二进制体积分析
        run: bash scripts/analyze-binary.sh /tmp/daemon

      - name: 检查体积回归
        run: |
          set -euo pipefail
          SIZE=$(stat -f%z /tmp/daemon)
          SIZE_KB=$((SIZE / 1024))
          echo "Binary size: ${SIZE_KB} KB"
          # 阈值与 bats 单测/tests/security-verification.sh 一致(当前 universal 约 117KB)
          if [ "$SIZE_KB" -gt 150 ]; then
            echo "::warning::Binary size increased to ${SIZE_KB} KB (expected <150KB)"
          fi
